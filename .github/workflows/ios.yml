name: iOS build and smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing memories and multiple photo persistence
        run: |
          swiftc -target "$(uname -m)-apple-macosx14.0" -parse-as-library Together/MemoryStore.swift Tests/MemoryPersistenceChecks.swift -o /tmp/memory-checks
          /tmp/memory-checks
      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild -project Together.xcodeproj -scheme Together -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Launch on iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/Together.app
          xcrun simctl launch "$DEVICE_ID" com.example.together
          sleep 5
          xcrun simctl spawn "$DEVICE_ID" launchctl list | grep com.example.together

      - name: Test saving, reopening, and deleting
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["state"] == "Booted" and "iPhone" in x["name"]))')
          xcodebuild -project Together.xcodeproj -scheme Together -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
